<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>💌</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background-color: #ffe3ee;
    /* tiny polka dots over a soft pink gradient */
    background-image:
      radial-gradient(rgba(255, 255, 255, .75) 1.6px, transparent 2px),
      radial-gradient(rgba(255, 160, 195, .28) 1.6px, transparent 2px),
      linear-gradient(165deg, #fff0f6 0%, #ffd9e8 45%, #ffc6dd 100%);
    background-size: 28px 28px, 28px 28px, 100% 100%;
    background-position: 0 0, 14px 14px, 0 0;
    font-family: Georgia, "Times New Roman", serif;
    color: #6b3a4f;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  canvas#c { display: block; position: fixed; inset: 0; z-index: 0; }

  /* ---------- scenes ---------- */
  .scene {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.2vh, 20px);
    padding: 44px 16px 20px; box-sizing: border-box; text-align: center;
    opacity: 0; visibility: hidden;
    transition: opacity .9s, visibility 0s .9s;
  }
  .scene.active { opacity: 1; visibility: visible; transition: opacity .9s .3s; }
  .title {
    font-style: italic; font-weight: normal; margin: 0; color: #e0507f;
    font-size: clamp(26px, 5vw, 44px);
    text-shadow: 0 2px 10px rgba(255, 255, 255, .9);
  }
  .sub { margin: 0; max-width: 560px; font-size: clamp(14px, 2vw, 18px); line-height: 1.5; color: #a0506e; }
  .btn {
    font: inherit; font-size: 17px; padding: 12px 26px; border-radius: 999px; cursor: pointer;
    border: none; color: #fff;
    background: linear-gradient(135deg, #ffa3c0, #ff6f9f);
    box-shadow: 0 6px 18px rgba(255, 111, 159, .35);
    transition: transform .25s, opacity .6s;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn.ghost { background: #fff; color: #e0507f; border: 1px solid #f9bcd2; box-shadow: 0 4px 12px rgba(224, 80, 127, .12); }
  .count { font-size: 14px; color: #b06a88; margin: 0; }

  .dots { position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 2; pointer-events: none; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(224, 80, 127, .2); transition: background .5s, transform .5s; }
  .dots i.on { background: #ff6f9f; transform: scale(1.2); }
  .music {
    position: fixed; top: 8px; right: 10px; z-index: 3; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid #f9bcd2; background: #fff; color: #e0507f; font-size: 18px; cursor: pointer;
  }
  .music.off { opacity: .45; text-decoration: line-through; }

  /* ---------- 1. envelope ---------- */
  .envelope { position: relative; width: min(78vw, 340px); aspect-ratio: 3 / 2; cursor: pointer; animation: bob 3s ease-in-out infinite; margin-top: 8vh; }
  .envelope.open { animation: none; cursor: default; }
  .env-back { position: absolute; inset: 0; background: #f59bb8; border-radius: 10px; box-shadow: 0 16px 40px rgba(224, 90, 130, .3); }
  .env-letter {
    position: absolute; left: 6%; right: 6%; top: 6%; bottom: 8%; z-index: 1;
    background: #fffafc; border-radius: 6px; color: #e0507f; font-style: italic; font-size: 19px;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 10%; box-sizing: border-box;
    transition: transform 1s .55s ease-out;
  }
  .env-front {
    position: absolute; inset: 0; z-index: 2; border-radius: 10px;
    background: linear-gradient(160deg, #ffd2e1, #fbb0c8);
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 62%; z-index: 3;
    background: linear-gradient(#ffe3ec, #f8bdd1);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top; transform: perspective(800px) rotateX(0deg);
    transition: transform .7s ease-in-out, z-index 0s .35s;
  }
  .env-seal {
    position: absolute; left: 50%; top: 56%; z-index: 4; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; display: grid; place-items: center; font-size: 24px;
    background: radial-gradient(circle at 35% 35%, #fff, #ffe0ea);
    border: 2px solid #f7a9c2;
    box-shadow: 0 3px 10px rgba(224, 90, 130, .3); transition: opacity .3s, transform .3s;
  }
  .envelope.open .env-seal { opacity: 0; transform: scale(1.4); }
  .envelope.open .env-flap { transform: perspective(800px) rotateX(180deg); z-index: 0; }
  .envelope.open .env-letter { transform: translateY(-62%); }
  .env-hint { animation: blink 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-1deg); } }
  @keyframes blink { 50% { opacity: .35; } }

  /* ---------- 2. letter ---------- */
  .paper {
    width: min(90vw, 560px); max-height: 62vh; overflow: auto; box-sizing: border-box;
    padding: 22px 24px; border-radius: 10px; text-align: left; cursor: pointer;
    background-color: #fffafc; color: #5e3a48; font-size: clamp(15px, 2vw, 18px); line-height: 1.75;
    background-image: repeating-linear-gradient(transparent 0 calc(1.75em - 1px), rgba(255, 111, 159, .16) calc(1.75em - 1px) 1.75em);
    background-attachment: local;
    border: 1px solid #fbd0de;
    box-shadow: 0 14px 40px rgba(224, 90, 130, .2); transform: rotate(-.6deg);
  }
  #letterText { white-space: pre-wrap; }
  #letterText.typing::after { content: "|"; color: #ff6f9f; animation: blink .8s steps(1) infinite; }
  .outro { opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .8s, transform .8s; }
  .outro.show { opacity: 1; pointer-events: auto; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="dots" id="dots"></div>
<button class="music" id="music" hidden title="Bật/tắt nhạc">♪</button>

<!-- 1. Envelope -->
<section class="scene" data-scene="envelope">
  <h2 class="title" id="toName"></h2>
  <p class="sub" id="envSub"></p>
  <div class="envelope" id="env">
    <div class="env-back"></div>
    <div class="env-letter" id="envLetter"></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-seal">💌</div>
  </div>
  <p class="count env-hint">Chạm vào phong thư để mở</p>
</section>

<!-- 2. Letter -->
<section class="scene" data-scene="letter">
  <h2 class="title" id="letterTitle"></h2>
  <div class="paper" id="paper"><span id="letterText"></span></div>
  <div class="outro" id="outro">
    <button class="btn ghost" id="replay">Xem lại từ đầu ↺</button>
  </div>
</section>

<script>
// =====================================================================
// ✏️  PERSONALIZE EVERYTHING HERE
// =====================================================================
const CONFIG = {
  // Optional background music: put an mp3 next to this file, e.g. 'song.mp3'
  music: '',

  pageTitle: 'Thư từ Quinn 💌',
  envelopeTitle: 'Gửi beer_club 💌',
  envelopeSub: 'Có lá thư nho nhỏ từ Quinn nè 🥹',
  envelopeLetter: 'Mở ra xem nha 👀',

  letterTitle: 'Vài dòng từ Quinn 💕',
  letter: `Hôm nay là LWD của em rồi 🥹 Cảm ơn các anh chị thời gian qua đã luôn support và giúp đỡ em nhaaa. Được gặp gỡ và quen biết mọi người, em rất rất vui ❤️

Sau này không còn gặp nhau trên công ty nữa nhưng nhớ vẫn phải rủ em đi nhậu nhaaa 🥹🍻

Chúc cả nhà luôn vui vẻ, công việc thuận lợi và kiếm thật nhiều tiền 💸❤️

Em Quinn 🫶🏻`,
};
// =====================================================================

const $ = s => document.querySelector(s);
const cvs = $('#c');
const ctx = cvs.getContext('2d');
const TAU = Math.PI * 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
// classic heart outline, point down; roughly -17..17 wide
function heartPt(t) {
  const s = Math.sin(t);
  return [16 * s * s * s, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
}

// ---------- layout ----------
let W, H, DPR, stars = [];
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  stars = Array.from({ length: Math.round((W * H) / 8000) }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: rand(.3, 1.6), p: Math.random() * TAU, s: rand(.6, 2.4),
  }));
}
addEventListener('resize', resize);
resize();

function petalPath(L, w, r = .6) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(w, -L * .25, w * r, -L, 0, -L);
  ctx.bezierCurveTo(-w * r, -L, -w, -L * .25, 0, 0);
  ctx.closePath();
}

function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * .35);
  ctx.bezierCurveTo(-s * .95, -s * .2, -s * .4, -s * .9, 0, -s * .35);
  ctx.bezierCurveTo(s * .4, -s * .9, s * .95, -s * .2, 0, s * .35);
  ctx.closePath();
}

// =====================================================================
// Particles (petals, hearts, sparks)
// =====================================================================
const PETAL_COLORS = ['#ffb7c5', '#ffcfd8', '#ffc8dd', '#ffd6e5', '#fcbfd0', '#f9a8c4'];
const HEART_COLORS = ['#ff8fb3', '#ff6f9f', '#ffb3cb', '#ff9ec0', '#f7a1d0', '#ffc2d6'];
let parts = [];

const addPetal = (x, y, vx, vy) =>
  parts.push({ k: 'petal', x, y, vx, vy, r: Math.random() * TAU, vr: rand(-3, 3), s: rand(7, 14), c: pick(PETAL_COLORS), life: 0, ph: Math.random() * TAU });
// drag > 0: velocity decays on both axes (used to draw shapes that expand then stop)
const addHeart = (x, y, vx, vy, s = rand(10, 18), drag = 0, max = rand(3, 5)) =>
  parts.push({ k: 'heart', x, y, vx, vy, s, drag, c: pick(HEART_COLORS), life: 0, max, ph: Math.random() * TAU });
const addSpark = (x, y, vx, vy) =>
  parts.push({ k: 'spark', x, y, vx, vy, s: rand(3, 7), life: 0, max: rand(.6, 1.2) });

function burst(x, y) {
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * TAU, sp = rand(120, 340);
    addPetal(x, y, Math.cos(a) * sp, Math.sin(a) * sp);
  }
  for (let i = 0; i < 6; i++) addHeart(x + rand(-20, 20), y, rand(-60, 60), rand(-140, -60), rand(12, 22));
  sparks(x, y, 16);
}

function sparks(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rand(80, 260);
    addSpark(x, y, Math.cos(a) * sp, Math.sin(a) * sp);
  }
}

// little hearts flying outward along a big heart outline
function heartBurst(x, y, k = 1) {
  const n = 60;
  for (let i = 0; i < n; i++) {
    const [hx, hy] = heartPt((i / n) * TAU);
    addHeart(x, y, hx * k * 22, hy * k * 22, rand(9, 15), 1.6, 2.6);
  }
  sparks(x, y, 20);
}

let spawnA = 0, spawnH = 0;
function updateParticles(dt) {
  let rate = scene === 'envelope' ? .6 : .9;
  if (reduce) rate *= 4;
  for (spawnA += dt; spawnA > rate; spawnA -= rate)
    if (parts.length < 170) addPetal(Math.random() * W, -20, rand(-15, 15), rand(30, 70));
  // hearts drifting up from the bottom
  const hr = reduce ? 3 : 1.4;
  for (spawnH += dt; spawnH > hr; spawnH -= hr)
    if (parts.length < 170) addHeart(Math.random() * W, H + 20, rand(-10, 10), rand(-70, -40), rand(10, 18), 0, rand(6, 9));

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life += dt;
    let dead = false;
    if (q.k === 'petal') {
      const fall = 40 + q.s * 3;
      q.vy += (fall - q.vy) * dt * 1.2;
      q.vx *= 1 - dt * 1.2;
      q.x += (q.vx + Math.sin(q.life * 1.8 + q.ph) * 25) * dt;
      q.y += q.vy * dt;
      q.r += q.vr * dt;
      dead = q.y > H + 30 || q.x < -80 || q.x > W + 80;
    } else if (q.k === 'heart') {
      if (q.drag) {
        q.vx *= 1 - dt * q.drag; q.vy *= 1 - dt * q.drag;
        q.x += q.vx * dt;
      } else {
        q.vx *= 1 - dt;
        q.x += (q.vx + Math.sin(q.life * 2 + q.ph) * 18) * dt;
      }
      q.y += q.vy * dt;
      dead = q.life > q.max;
    } else {
      q.vx *= 1 - dt * 3; q.vy *= 1 - dt * 3;
      q.x += q.vx * dt; q.y += q.vy * dt;
      dead = q.life > q.max;
    }
    if (dead) parts.splice(i, 1);
  }
}

function drawParticles() {
  for (const q of parts) {
    ctx.save();
    ctx.translate(q.x, q.y);
    if (q.k === 'petal') {
      ctx.rotate(q.r);
      ctx.scale(1, .45 + .55 * Math.abs(Math.sin(q.life * 2.5 + q.ph)));
      ctx.translate(0, q.s / 2);
      ctx.globalAlpha = .85;
      ctx.fillStyle = q.c;
      petalPath(q.s, q.s * .6, .8);
      ctx.fill();
    } else if (q.k === 'heart') {
      const l = clamp(q.life / q.max);
      ctx.globalAlpha = (q.drag ? 1 - l * l : Math.sin(Math.PI * l)) * .9;
      ctx.rotate(Math.sin(q.life * 1.6 + q.ph) * .25);
      ctx.fillStyle = q.c;
      heartPath(q.s);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.ellipse(-q.s * .3, -q.s * .3, q.s * .1, q.s * .06, -.6, 0, TAU); ctx.fill();
    } else {
      ctx.globalAlpha = 1 - q.life / q.max;
      ctx.strokeStyle = '#ffb3cb';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-q.s, 0); ctx.lineTo(q.s, 0);
      ctx.moveTo(0, -q.s); ctx.lineTo(0, q.s);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// soft pink bokeh drifting upward
function drawBokeh(time, dt) {
  for (const s of stars) {
    const tw = .15 + .6 * Math.abs(Math.sin(time * s.s * .5 + s.p));
    s.y -= s.s * 3 * dt;
    if (s.y < -10) s.y = H + 10;
    ctx.fillStyle = `rgba(255,150,190,${tw * .3})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 3, 0, TAU); ctx.fill();
  }
}

// ---------- main loop ----------
let last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, .05);
  last = now;
  ctx.clearRect(0, 0, W, H);
  drawBokeh(now / 1000, dt);
  updateParticles(dt);
  drawParticles();
  requestAnimationFrame(frame);
}

// =====================================================================
// Scenes
// =====================================================================
const STEPS = ['envelope', 'letter'];
let scene = null;
const enter = {};

$('#dots').innerHTML = STEPS.map(() => '<i></i>').join('');

function go(name) {
  scene = name;
  document.querySelectorAll('.scene').forEach(el => el.classList.toggle('active', el.dataset.scene === name));
  const idx = STEPS.indexOf(name);
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i <= idx));
  enter[name]?.();
}

// tap on empty space = little magic
document.addEventListener('pointerdown', e => {
  if (e.target.classList?.contains('scene') && scene !== 'envelope') burst(e.clientX, e.clientY);
});

// ---------- 1. envelope ----------
document.title = CONFIG.pageTitle;
$('#toName').textContent = CONFIG.envelopeTitle;
$('#envSub').textContent = CONFIG.envelopeSub;
$('#envLetter').textContent = CONFIG.envelopeLetter;

let audio = null;
if (CONFIG.music) {
  audio = new Audio(CONFIG.music);
  audio.loop = true;
  audio.volume = .6;
  $('#music').addEventListener('click', () => {
    if (audio.paused) audio.play().catch(() => {}); else audio.pause();
    $('#music').classList.toggle('off', audio.paused);
  });
}

$('#env').addEventListener('click', () => {
  const env = $('#env');
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  if (audio) { audio.play().catch(() => {}); $('#music').hidden = false; }
  const r = env.getBoundingClientRect();
  setTimeout(() => burst(r.left + r.width / 2, r.top), 900);
  setTimeout(() => go('letter'), 2300);
});

// ---------- 2. letter ----------
$('#letterTitle').textContent = CONFIG.letterTitle;
// split by code point so emoji are never cut in half while typing
const letter = Array.from(CONFIG.letter);
let typed = 0, typer = null;

enter.letter = () => {
  const out = $('#letterText');
  out.classList.add('typing');
  typer = setInterval(() => {
    typed = Math.min(letter.length, typed + 1);
    out.textContent = letter.slice(0, typed).join('');
    $('#paper').scrollTop = $('#paper').scrollHeight;
    if (typed >= letter.length) {
      clearInterval(typer);
      out.classList.remove('typing');
      const k = Math.min(W, H) / 650;
      heartBurst(W / 2, H / 2, k);
      for (let i = 1; i <= 4; i++)
        setTimeout(() => heartBurst(rand(.2, .8) * W, rand(.2, .7) * H, k * rand(.35, .6)), i * 700);
      setTimeout(() => $('#outro').classList.add('show'), 1200);
    }
  }, reduce ? 1 : 45);
};
// tap the letter to skip typing
$('#paper').addEventListener('click', () => { typed = letter.length - 1; });
$('#replay').addEventListener('click', () => location.reload());

go('envelope');
requestAnimationFrame(frame);
</script>
</body>
</html>
